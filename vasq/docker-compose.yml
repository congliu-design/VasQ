version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile 
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      # expression backends read from an absolute /data path (see functions.py)
      - ./data:/data
    ports:
      - "8000:8000"
    env_file:
      - ../.env-shared
    depends_on:
      - kg_rag

  kg_rag:
    build:
      context: ../kg_rag
      dockerfile: Dockerfile.flask
    ports:
      - "5005:5005"
    environment:
      - FLASK_APP=api.py